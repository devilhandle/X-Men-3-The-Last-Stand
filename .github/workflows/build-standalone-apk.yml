name: Build Standalone APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build standalone APK
        run: bash scripts/build-standalone.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X-Men-3-The-Last-Stand-Standalone-APK
          path: runtime/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
